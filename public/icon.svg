<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle safe zone -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer AR Viewfinder brackets -->
  <path d="M 120 180 L 120 130 L 170 130" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 392 180 L 392 130 L 342 130" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 120 332 L 120 382 L 170 382" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 392 332 L 392 382 L 342 382" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Architectural Dome & Monument silhouette -->
  <path d="M 256 160 C 220 160, 196 195, 190 230 L 322 230 C 316 195, 292 160, 256 160 Z" fill="url(#cyanGrad)"/>
  <!-- Spire top -->
  <path d="M 256 125 L 256 160" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="120" r="8" fill="#fde047"/>

  <!-- Monument pillars/facade -->
  <rect x="194" y="240" width="18" height="90" rx="4" fill="#38bdf8" opacity="0.9"/>
  <rect x="230" y="240" width="18" height="90" rx="4" fill="#38bdf8" opacity="0.9"/>
  <rect x="264" y="240" width="18" height="90" rx="4" fill="#38bdf8" opacity="0.9"/>
  <rect x="300" y="240" width="18" height="90" rx="4" fill="#38bdf8" opacity="0.9"/>

  <!-- Central Arch entrance -->
  <path d="M 240 330 L 240 280 C 240 270, 272 270, 272 280 L 272 330 Z" fill="#0f172a"/>

  <!-- Plinth/Base -->
  <rect x="175" y="330" width="162" height="16" rx="4" fill="url(#cyanGrad)"/>

  <!-- Compass / AR Target pulse ring -->
  <circle cx="256" cy="256" r="160" stroke="#06b6d4" stroke-width="4" stroke-dasharray="8 12" fill="none" opacity="0.4"/>
  <!-- Glowing pulse dot -->
  <circle cx="340" cy="180" r="12" fill="url(#goldGrad)"/>
</svg>
