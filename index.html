    <script>
      // Gracefully prevent benign Vite dev-server HMR reconnect and Firestore transport reconnect notices from polluting terminal logs
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && (e.reason || e.detail?.reason);
        var msg = (reason && (reason.message || String(reason))) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('WebChannel') !== -1) {
          e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
      }, true);

      window.addEventListener('error', function (e) {
        var msg = (e && (e.message || (e.error && e.error.message))) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('WebChannel') !== -1) {
          e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
      }, true);

      (function() {
        var isBenign = function(args) {
          try {
            var fullText = '';
            for (var i = 0; i < args.length; i++) {
              var item = args[i];
              fullText += ' ' + (typeof item === 'string' ? item : (item && item.message) || String(item));
            }
            return fullText.indexOf('[vite] failed to connect to websocket') !== -1 ||
                   fullText.indexOf('WebSocket closed without opened') !== -1 ||
                   fullText.indexOf('WebChannel') !== -1 ||
                   (fullText.indexOf('@firebase/firestore') !== -1 && fullText.indexOf('transport errored') !== -1);
          } catch (_) {
            return false;
          }
        };

        var origError = console.error;
        console.error = function() {
          if (isBenign(arguments)) return;
          return origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          if (isBenign(arguments)) return;
          return origWarn.apply(console, arguments);
        };
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200 min-h-screen">
